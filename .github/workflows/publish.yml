# When a tag vX.Y.Z is pushed (tool/release.sh pushes it): tests, publishes to pub.dev, then creates
# the GitHub release with the CHANGELOG section of that version as its notes.
# pub.dev trusts this repository through OIDC: see "Automated publishing" on the package admin page.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
  publish:
    needs: test
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="## $version" '$0 == v {on = 1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          printf '\n[pub.dev](https://pub.dev/packages/revoockv_audio_enhance/versions/%s)\n' "$version" >> notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
