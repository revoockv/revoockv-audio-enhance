name: Test

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format -l 120 --output=none --set-exit-if-changed lib test
      - run: dart analyze --fatal-infos
      - run: dart test
